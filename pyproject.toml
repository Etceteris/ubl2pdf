[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

[project]
name = "ubl2pdf"
version = "0.1.0"
description = "Conversion de factures électroniques UBL / EN16931 en PDF lisible."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Proprietary" }
authors = [
    { name = "Christian Mazeau" },
]
dependencies = [
    "lxml>=5.3",
    "pydantic>=2.10",
    "reportlab>=4.2",
    "typer>=0.26",
]

[project.scripts]
ubl2pdf = "ubl2pdf.cli:app"

[dependency-groups]
dev = [
    "bandit>=1.8",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
    "pymdown-extensions>=10.14",
]

[tool.pdm.build]
package-dir = "src"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["ubl2pdf"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]

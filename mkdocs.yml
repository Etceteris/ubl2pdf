site_name: ubl2pdf
site_description: Conversion de factures électroniques UBL / EN16931 en PDF

theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

nav:
  - Accueil: index.md
  - Guide:
      - Installation: guide/installation.md
      - Utilisation: guide/usage.md
      - Architecture: guide/architecture.md
  - Référence:
      - Parser: reference/parser.md
      - Service: reference/service.md
